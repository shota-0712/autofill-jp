<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AutoFill JP</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", sans-serif;
      font-size: 13px;
      color: #1d1d1f;
      background: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    header {
      padding: 14px 16px 13px;
      background: #ffffff;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #1d1d1f; }
    .count { font-size: 11px; color: #6e6e73; margin-top: 2px; }

    main { padding: 12px; display: flex; flex-direction: column; gap: 8px; }

    button {
      width: 100%; padding: 11px 14px; border: none; border-radius: 980px;
      font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.82; }

    .btn-primary { background: #1d1d1f; color: #fff; }
    .btn-learn   { background: #0066cc; color: #fff; }
    .btn-secondary { background: #fff; color: #1d1d1f; border: 1px solid rgba(0,0,0,0.1); }

    .status {
      padding: 8px 12px; background: white; border-radius: 8px;
      border-left: 3px solid #0066cc;
      font-size: 12px; color: #6e6e73; min-height: 16px; display: none;
    }
    .status.visible { display: block; }
    .status.success { border-color: #34c759; color: #1a7a36; }
    .status.error   { border-color: #ff3b30; color: #c0170f; }

    footer {
      padding: 10px 16px; border-top: 1px solid rgba(0,0,0,0.08); background: #fff;
      text-align: center;
    }
    footer a { color: #0066cc; text-decoration: none; font-size: 12px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <h1>AutoFill JP</h1>
    <div class="count" id="count">ルール: 読み込み中...</div>
  </header>
  <main>
    <button id="fill" class="btn-primary">このページを自動入力</button>
    <button id="learn" class="btn-learn">入力内容を学習</button>
    <div class="status" id="status"></div>
  </main>
  <footer>
    <a href="#" id="opts">設定・ルール編集</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
